<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>View your matchday pegs</title>

    <!-- WhatsApp & Social Media Preview Metadata -->
    <meta property="og:title" content="View your matchday pegs">
    <meta property="og:description" content="Click the link below to view">
    <meta name="description" content="Click the link below to view">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Barlow Condensed & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pixelBlue: '#a8c7fa',
                        pixelGold: '#fde047',
                        pixelEmerald: '#4ade80',
                        pixelCyan: '#38bdf8',
                        pixelCoral: '#f87171',
                        pixelMuted: '#cbd5e1',
                        pixelText: '#ffffff'
                    },
                    fontFamily: {
                        heading: ['Barlow Condensed', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root { color-scheme: dark; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #1e293b 65%, #0f172a 100%) fixed;
            color: #ffffff;
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        /* DISTINCT DAY 2 BACKGROUND GRADIENT ACCENT */
        body.day2-active {
            background: radial-gradient(circle at 50% 0%, #78350f 0%, #1e293b 65%, #0f172a 100%) fixed;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .font-mono-tabular {
            font-family: 'Inter', system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            transition: border-color 0.4s ease, background 0.4s ease;
        }

        body.day2-active .glass-card-day-matrix {
            background: rgba(45, 26, 14, 0.8) !important;
            border-color: rgba(253, 224, 71, 0.35) !important;
        }

        .glass-card-sm {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3);
            border-radius: 18px;
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
        }

        .zone-badge-Red { background: rgba(239, 68, 68, 0.75); border: 1.5px solid #f87171; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .zone-badge-Yellow { background: rgba(234, 179, 8, 0.75); border: 1.5px solid #fde047; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .zone-badge-Green { background: rgba(34, 197, 94, 0.75); border: 1.5px solid #4ade80; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .zone-badge-Blue { background: rgba(14, 165, 233, 0.75); border: 1.5px solid #38bdf8; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .zone-card-Red { background: rgba(239, 68, 68, 0.22); border-top: 5px solid #f87171; border-color: rgba(248, 113, 113, 0.5); }
        .zone-card-Yellow { background: rgba(234, 179, 8, 0.22); border-top: 5px solid #fde047; border-color: rgba(253, 224, 71, 0.5); }
        .zone-card-Green { background: rgba(34, 197, 94, 0.22); border-top: 5px solid #4ade80; border-color: rgba(74, 222, 128, 0.5); }
        .zone-card-Blue { background: rgba(14, 165, 233, 0.22); border-top: 5px solid #38bdf8; border-color: rgba(56, 189, 248, 0.5); }

        .touch-elastic {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .touch-elastic:active { transform: scale(0.96); }

        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(168, 199, 250, 0.5); border-radius: 9999px; }
    </style>
</head>
<body id="appBody" class="min-h-screen flex flex-col antialiased selection:bg-pixelBlue selection:text-slate-950 pb-12">

    <main class="max-w-5xl mx-auto px-2.5 sm:px-6 py-4 sm:py-6 w-full space-y-4 sm:space-y-6 flex-grow">

        <!-- NO DATA / MISSING JSON WARNING -->
        <div id="noDataPanel" class="glass-card p-6 sm:p-12 text-center space-y-4 mt-2">
            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-pixelCoral/25 border border-pixelCoral/50 flex items-center justify-center text-pixelCoral mx-auto">
                <i class="fa-solid fa-file-circle-exclamation text-2xl sm:text-3xl"></i>
            </div>
            <h2 class="text-xl sm:text-3xl font-black font-heading text-pixelText uppercase tracking-wider">No Draw Data Found</h2>
            <p class="text-pixelMuted text-xs sm:text-base max-w-md mx-auto font-medium leading-relaxed">
                Please upload the <code class="text-pixelBlue bg-slate-900 px-2 py-0.5 rounded font-mono-tabular text-xs">live_draw.json</code> file exported from Shorescore to this repository.
            </p>
        </div>

        <!-- MAIN VIEWER CONTENT CONTAINER -->
        <div id="viewerMainContent" class="hidden space-y-4 sm:space-y-6">

            <!-- SECTION 1: PERSONAL ANGLER LOOKUP (TOP DASHBOARD) -->
            <div class="glass-card p-4 sm:p-8 space-y-4 sm:space-y-6">
                <div class="space-y-2 relative">
                    <label class="block text-xs font-black uppercase tracking-wider text-pixelBlue font-heading flex items-center gap-1.5">
                        <i class="fa-solid fa-magnifying-glass"></i> Find My Draw & Teammates
                    </label>
                    <div class="relative">
                        <input type="text" id="anglerSearchInput" onkeyup="handleAnglerSearch()" onkeydown="handleSearchKeyDown(event)" autocomplete="off" inputmode="search" enterkeyhint="search" class="w-full bg-slate-900/90 border border-white/25 rounded-2xl px-4 py-3.5 text-pixelText font-bold text-sm sm:text-base uppercase tracking-wider placeholder-pixelMuted focus:outline-none focus:border-pixelBlue" placeholder="Type your name...">
                        <button onclick="clearSearchInput()" class="absolute right-3 top-3 w-8 h-8 rounded-full glass-pill flex items-center justify-center text-pixelMuted hover:text-white font-bold text-lg">&times;</button>
                    </div>

                    <!-- PREDICTIVE NAME AUTOCOMPLETE DROPDOWN -->
                    <div id="searchResultsDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-900/95 backdrop-blur-2xl border-2 border-pixelBlue/60 rounded-2xl shadow-2xl z-50 max-h-44 overflow-y-auto custom-scrollbar p-2 space-y-1"></div>
                </div>

                <!-- PERSONAL RESULT CARD CONTAINER -->
                <div id="personalResultCardContainer"></div>
            </div>

            <!-- SECTION 2: FULL VENUE BEACH MATRIX -->
            <div id="beachMatrixCard" class="glass-card glass-card-day-matrix p-4 sm:p-8 space-y-4 sm:space-y-6">
                
                <!-- PROMINENT DAY STATUS BANNER & SWITCHER -->
                <div class="space-y-3 border-b border-white/20 pb-4">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div>
                            <h3 class="text-lg sm:text-2xl font-black font-heading text-pixelText flex items-center gap-2 uppercase tracking-wider">
                                <i class="fa-solid fa-layer-group text-pixelBlue"></i> Full Beach Venue Layout
                            </h3>
                            <p class="text-xs text-pixelMuted font-medium mt-0.5">Browse complete zone allocations across all pegs on the venue.</p>
                        </div>

                        <!-- SEGMENTED DAY SELECTOR TOGGLE (2-DAY MATCHES) -->
                        <div id="beachDayToggleGroup" class="bg-slate-950/90 p-1 rounded-2xl border border-white/20 flex items-center gap-1 w-full sm:w-auto hidden">
                            <button onclick="setBeachViewDay(1)" id="beachDayBtn1" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-slate-950 bg-pixelBlue shadow-lg border border-pixelBlue/60 transition-all touch-elastic flex items-center justify-center gap-2">
                                <i class="fa-solid fa-calendar-day"></i> Day 1 Draw
                            </button>
                            <button onclick="setBeachViewDay(2)" id="beachDayBtn2" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-pixelMuted hover:text-white transition-all touch-elastic flex items-center justify-center gap-2">
                                <i class="fa-solid fa-calendar-check"></i> Day 2 Draw
                            </button>
                        </div>
                    </div>

                    <!-- LARGE VISUAL ACTIVE DAY ACCENT BANNER -->
                    <div id="activeDayBanner" class="w-full py-2 px-4 rounded-xl bg-pixelBlue/20 border-2 border-pixelBlue/60 flex items-center justify-between">
                        <span id="activeDayBannerText" class="text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-pixelBlue flex items-center gap-2">
                            <i class="fa-solid fa-eye text-base"></i> Currently Viewing: DAY 1 ALLOCATIONS
                        </span>
                        <span id="activeDayBannerBadge" class="text-[10px] font-black uppercase tracking-wider bg-pixelBlue text-slate-950 px-2.5 py-0.5 rounded font-heading shadow">
                            Day 1 Active
                        </span>
                    </div>
                </div>

                <!-- 4-ZONE CARD GRID -->
                <div id="fullBeachZoneGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-start"></div>
            </div>

        </div>

    </main>

    <!-- "WHO'S BESIDE ME?" NEIGHBOR POPUP MODAL -->
    <div id="besideMeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="glass-card max-w-lg w-full p-5 sm:p-7 space-y-5 border-2 border-pixelBlue/80 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/20 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-users-between-lines text-pixelBlue text-xl"></i>
                    <h3 class="text-xl font-black font-heading text-pixelText uppercase tracking-wider">Who's Beside Me?</h3>
                </div>
                <button onclick="closeBesideMeModal()" class="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-pixelMuted hover:text-white font-bold text-xl">&times;</button>
            </div>

            <div id="besideMeModalContent" class="space-y-4">
                <!-- Neighbor rows populate dynamically here -->
            </div>

            <button onclick="closeBesideMeModal()" class="w-full py-3 rounded-xl bg-pixelBlue text-slate-950 font-black font-heading uppercase tracking-wider text-sm shadow-lg hover:bg-pixelBlue/90 transition-all touch-elastic">
                Close
            </button>
        </div>
    </div>

    <!-- VIEWER ENGINE SCRIPT -->
    <script>
        let viewerData = null;
        let activeBeachDay = 1;
        let selectedAnglerId = null;

        const ZONE_COLORS = ['Red', 'Yellow', 'Green', 'Blue'];

        window.addEventListener('DOMContentLoaded', () => {
            loadLiveDrawJSON();
            setupClickOutsideListener();
            registerServiceWorker();
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker registration skipped or failed:', err);
                });
            }
        }

        function loadLiveDrawJSON() {
            const timestamp = new Date().getTime();
            
            fetch('live_draw.json?v=' + timestamp)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.anglers && data.draw) {
                        viewerData = data;
                        renderHeaderDetails();
                        document.getElementById('noDataPanel').classList.add('hidden');
                        document.getElementById('viewerMainContent').classList.remove('hidden');
                        
                        // Check for deep-link URL parameter ?angler=
                        checkURLDeepLink();
                        
                        if (!selectedAnglerId) {
                            renderPersonalCard(null);
                        }
                        renderFullBeachMatrix();
                    } else {
                        showNoDataWarning();
                    }
                })
                .catch(err => {
                    console.error("Failed to fetch live_draw.json:", err);
                    showNoDataWarning();
                });
        }

        function showNoDataWarning() {
            document.getElementById('noDataPanel').classList.remove('hidden');
            document.getElementById('viewerMainContent').classList.add('hidden');
        }

        function renderHeaderDetails() {
            const matchDuration = viewerData.duration || viewerData.d || 1;
            const dayToggleGroup = document.getElementById('beachDayToggleGroup');

            if (matchDuration === 2) dayToggleGroup.classList.remove('hidden');
            else dayToggleGroup.classList.add('hidden');
        }

        function setupClickOutsideListener() {
            document.addEventListener('click', (e) => {
                const searchContainer = document.getElementById('anglerSearchInput')?.parentElement?.parentElement;
                const dropdown = document.getElementById('searchResultsDropdown');
                if (searchContainer && !searchContainer.contains(e.target) && dropdown) {
                    dropdown.classList.add('hidden');
                }
            });
        }

        function handleSearchKeyDown(event) {
            if (event.key === 'Enter') {
                const dropdown = document.getElementById('searchResultsDropdown');
                const firstOption = dropdown.querySelector('[data-angler-id]');
                if (firstOption) {
                    const anglerId = firstOption.getAttribute('data-angler-id');
                    selectAnglerFromDropdown(anglerId);
                } else {
                    document.getElementById('anglerSearchInput').blur();
                }
            } else if (event.key === 'Escape') {
                document.getElementById('searchResultsDropdown').classList.add('hidden');
                document.getElementById('anglerSearchInput').blur();
            }
        }

        function handleAnglerSearch() {
            const query = (document.getElementById('anglerSearchInput').value || '').trim().toLowerCase();
            const dropdown = document.getElementById('searchResultsDropdown');

            if (query.length < 1) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
                selectedAnglerId = null;
                renderPersonalCard(null);
                renderFullBeachMatrix();
                return;
            }

            const matches = viewerData.anglers.filter(a => (a.name || '').toLowerCase().includes(query));

            if (matches.length > 0) {
                dropdown.innerHTML = matches.map(a => {
                    const team = viewerData.teams ? viewerData.teams.find(t => t.id === a.teamId) : null;
                    return `
                        <div data-angler-id="${a.id}" onclick="selectAnglerFromDropdown('${a.id}')" class="px-3 py-2 rounded-xl hover:bg-pixelBlue/20 cursor-pointer flex items-center justify-between border border-transparent hover:border-pixelBlue/40 transition-all">
                            <span class="font-black text-pixelText font-heading text-xs sm:text-sm uppercase">${(a.name || 'Unnamed').toUpperCase()}</span>
                            <span class="text-[9px] sm:text-[10px] font-bold text-pixelCyan uppercase tracking-wider">${team ? team.name.toUpperCase() : 'INDIVIDUAL'}</span>
                        </div>
                    `;
                }).join('');
                dropdown.classList.remove('hidden');
            } else {
                dropdown.innerHTML = `<div class="px-3 py-2 text-xs font-bold text-pixelMuted text-center">No anglers found matching "${query}"</div>`;
                dropdown.classList.remove('hidden');
            }

            if (matches.length === 1) {
                selectedAnglerId = matches[0].id;
                renderPersonalCard(matches[0]);
                renderFullBeachMatrix();
            }
        }

        function selectAnglerFromDropdown(anglerId) {
            const targetAngler = viewerData.anglers.find(a => a.id === anglerId);
            if (targetAngler) {
                selectedAnglerId = targetAngler.id;
                const input = document.getElementById('anglerSearchInput');
                input.value = targetAngler.name;
                document.getElementById('searchResultsDropdown').classList.add('hidden');
                
                // Dismiss mobile virtual keyboard
                input.blur();
                
                renderPersonalCard(targetAngler);
                renderFullBeachMatrix();
                
                // Smooth scroll to personal result card
                setTimeout(() => {
                    const cardContainer = document.getElementById('personalResultCardContainer');
                    if (cardContainer) {
                        cardContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }, 100);
            }
        }

        function clearSearchInput() {
            document.getElementById('anglerSearchInput').value = '';
            document.getElementById('searchResultsDropdown').classList.add('hidden');
            selectedAnglerId = null;
            renderPersonalCard(null);
            renderFullBeachMatrix();
            updateURLParameter(null);
        }

        function renderPersonalCard(targetAngler) {
            const container = document.getElementById('personalResultCardContainer');

            if (!targetAngler) {
                container.innerHTML = `
                    <div class="glass-card-sm p-4 sm:p-6 text-center text-pixelMuted font-bold text-xs sm:text-sm">
                        Type your name in the search box above to isolate your Day 1 & Day 2 pegs and teammates.
                    </div>
                `;
                return;
            }

            updateURLParameter(targetAngler.name);

            const matchDuration = viewerData.duration || viewerData.d || 1;
            const d1Alloc = viewerData.draw.day1 ? viewerData.draw.day1.find(d => (d.anglerId || d.aId) === targetAngler.id) : null;
            const d2Alloc = (matchDuration === 2 && viewerData.draw.day2) ? viewerData.draw.day2.find(d => (d.anglerId || d.aId) === targetAngler.id) : null;
            const team = viewerData.teams ? viewerData.teams.find(t => t.id === targetAngler.teamId) : null;

            const teammates = targetAngler.teamId 
                ? viewerData.anglers.filter(a => a.teamId === targetAngler.teamId && a.id !== targetAngler.id)
                : [];

            let teammateRowsHTML = '';
            if (teammates.length > 0) {
                teammateRowsHTML = teammates.map(m => {
                    const mD1 = viewerData.draw.day1 ? viewerData.draw.day1.find(d => (d.anglerId || d.aId) === m.id) : null;
                    const mD2 = (matchDuration === 2 && viewerData.draw.day2) ? viewerData.draw.day2.find(d => (d.anglerId || d.aId) === m.id) : null;

                    const mD1Zone = mD1 ? (mD1.zone || mD1.z) : '';
                    const mD1Peg = mD1 ? (mD1.peg || mD1.p) : '';
                    const mD2Zone = mD2 ? (mD2.zone || mD2.z) : '';
                    const mD2Peg = mD2 ? (mD2.peg || mD2.p) : '';

                    return `
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1.5 py-2.5 px-3 rounded-xl bg-slate-900/80 border border-white/15 text-xs font-bold">
                            <span class="text-pixelText font-heading text-sm uppercase truncate">${(m.name || 'Unnamed').toUpperCase()}</span>
                            <div class="flex items-center gap-2 font-mono-tabular shrink-0 self-end sm:self-auto">
                                ${mD1 ? `<span class="zone-badge-${mD1Zone} px-2 py-0.5 rounded-md font-black text-[11px]">D1: ${mD1Zone} Peg${mD1Peg}</span>` : ''}
                                ${mD2 ? `<span class="zone-badge-${mD2Zone} px-2 py-0.5 rounded-md font-black text-[11px]">D2: ${mD2Zone} Peg${mD2Peg}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const d1Zone = d1Alloc ? (d1Alloc.zone || d1Alloc.z) : '';
            const d1Peg = d1Alloc ? (d1Alloc.peg || d1Alloc.p) : '';
            const d2Zone = d2Alloc ? (d2Alloc.zone || d2Alloc.z) : '';
            const d2Peg = d2Alloc ? (d2Alloc.peg || d2Alloc.p) : '';
            const isMobility = targetAngler.mobility || targetAngler.mob;

            container.innerHTML = `
                <div class="glass-card-sm p-4 sm:p-6 space-y-4 sm:space-y-6 border-2 border-pixelBlue/60 bg-pixelBlue/10">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 border-b border-white/20 pb-3">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-xl sm:text-3xl font-black font-heading text-pixelText uppercase tracking-wider">${(targetAngler.name || 'Unnamed').toUpperCase()}</h3>
                                ${isMobility ? '<span class="bg-pixelGold text-slate-950 font-black text-[10px] px-1.5 py-0.5 rounded-md font-sans">[A] MOBILITY</span>' : ''}
                            </div>
                            <span class="text-xs font-black text-pixelCyan uppercase tracking-wider font-heading">${team ? team.name.toUpperCase() : 'INDIVIDUAL COMPETITOR'}</span>
                        </div>

                        <!-- WHO'S BESIDE ME BUTTON -->
                        <button onclick="openBesideMeModal('${targetAngler.id}')" class="px-4 py-2 rounded-xl text-xs font-black font-heading uppercase tracking-wider bg-pixelGold text-slate-950 shadow-md border border-pixelGold/60 hover:bg-pixelGold/90 transition-all touch-elastic flex items-center gap-1.5 self-start sm:self-auto">
                            <i class="fa-solid fa-users-between-lines"></i> Who's Beside Me?
                        </button>
                    </div>

                    <!-- DAY 1 & DAY 2 ALLOCATION TILES -->
                    <div class="grid grid-cols-1 ${matchDuration === 2 ? 'sm:grid-cols-2' : ''} gap-3 sm:gap-4">
                        <div class="glass-card-sm p-3.5 sm:p-4 space-y-1.5 border border-white/20 text-center">
                            <span class="text-[11px] font-black text-pixelMuted uppercase tracking-wider font-heading block">Day 1 Placement</span>
                            ${d1Alloc ? `
                                <div class="zone-badge-${d1Zone} rounded-xl py-3 px-3 shadow-lg">
                                    <span class="text-3xl sm:text-5xl font-black font-mono-tabular">PEG ${d1Peg}</span>
                                </div>
                            ` : '<span class="text-pixelMuted italic text-xs">Unassigned</span>'}
                        </div>

                        ${matchDuration === 2 ? `
                            <div class="glass-card-sm p-3.5 sm:p-4 space-y-1.5 border border-white/20 text-center">
                                <span class="text-[11px] font-black text-pixelMuted uppercase tracking-wider font-heading block">Day 2 Placement</span>
                                ${d2Alloc ? `
                                    <div class="zone-badge-${d2Zone} rounded-xl py-3 px-3 shadow-lg">
                                        <span class="text-3xl sm:text-5xl font-black font-mono-tabular">PEG ${d2Peg}</span>
                                    </div>
                                ` : '<span class="text-pixelMuted italic text-xs">Unassigned</span>'}
                            </div>
                        ` : ''}
                    </div>

                    <!-- TEAMMATES PANEL WITH INDIVIDUAL NAMES -->
                    ${teammates.length > 0 ? `
                        <div class="pt-2 border-t border-white/20 space-y-2.5">
                            <span class="text-xs font-black text-pixelMuted uppercase tracking-wider font-heading block flex items-center gap-1.5">
                                <i class="fa-solid fa-users text-pixelBlue"></i> Team Members (${team ? team.name.toUpperCase() : ''}):
                            </span>
                            <div class="space-y-2">${teammateRowsHTML}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        /* "WHO'S BESIDE ME?" MODAL LOGIC */
        function openBesideMeModal(anglerId) {
            const angler = viewerData.anglers.find(a => a.id === anglerId);
            if (!angler) return;

            const matchDuration = viewerData.duration || viewerData.d || 1;
            const modalContent = document.getElementById('besideMeModalContent');

            let html = '';

            const getNeighborsForDay = (drawList, dayLabel) => {
                const userAlloc = drawList ? drawList.find(d => (d.anglerId || d.aId) === anglerId) : null;
                if (!userAlloc) return `<div class="glass-card-sm p-3 text-xs text-pixelMuted italic text-center">${dayLabel}: No placement found</div>`;

                const zone = userAlloc.zone || userAlloc.z;
                const pegNum = parseInt(userAlloc.peg || userAlloc.p) || 0;

                const zonePegs = drawList.filter(d => (d.zone || d.z) === zone);
                
                const leftAlloc = zonePegs.find(d => (parseInt(d.peg || d.p) || 0) === pegNum - 1);
                const rightAlloc = zonePegs.find(d => (parseInt(d.peg || d.p) || 0) === pegNum + 1);

                const leftAngler = leftAlloc ? viewerData.anglers.find(a => a.id === (leftAlloc.anglerId || leftAlloc.aId)) : null;
                const rightAngler = rightAlloc ? viewerData.anglers.find(a => a.id === (rightAlloc.anglerId || rightAlloc.aId)) : null;

                return `
                    <div class="glass-card-sm p-4 space-y-3 border border-white/20">
                        <div class="flex items-center justify-between border-b border-white/10 pb-2">
                            <span class="font-heading font-black text-sm uppercase text-pixelGold">${dayLabel} — ${zone} Zone (Your Peg: ${pegNum})</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-white/10 space-y-1">
                                <span class="text-[10px] font-black text-pixelMuted uppercase block">Left (Peg ${pegNum - 1})</span>
                                <span class="font-black text-pixelText uppercase font-heading text-sm block truncate">${leftAngler ? leftAngler.name : 'End of Zone'}</span>
                            </div>
                            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-white/10 space-y-1 text-right">
                                <span class="text-[10px] font-black text-pixelMuted uppercase block">Right (Peg ${pegNum + 1})</span>
                                <span class="font-black text-pixelText uppercase font-heading text-sm block truncate">${rightAngler ? rightAngler.name : 'End of Zone'}</span>
                            </div>
                        </div>
                    </div>
                `;
            };

            html += getNeighborsForDay(viewerData.draw.day1, 'Day 1');
            if (matchDuration === 2) {
                html += getNeighborsForDay(viewerData.draw.day2, 'Day 2');
            }

            modalContent.innerHTML = html;
            document.getElementById('besideMeModal').classList.remove('hidden');
        }

        function closeBesideMeModal() {
            document.getElementById('besideMeModal').classList.add('hidden');
        }

        function updateURLParameter(name) {
            if (history.pushState) {
                const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + (name ? '?angler=' + encodeURIComponent(name) : '');
                window.history.pushState({path: newurl}, '', newurl);
            }
        }

        function checkURLDeepLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const anglerParam = urlParams.get('angler');
            if (anglerParam && viewerData && viewerData.anglers) {
                const match = viewerData.anglers.find(a => (a.name || '').toLowerCase() === anglerParam.toLowerCase());
                if (match) {
                    document.getElementById('anglerSearchInput').value = match.name;
                    selectAnglerFromDropdown(match.id);
                }
            }
        }

        function setBeachViewDay(day) {
            activeBeachDay = day;
            const btn1 = document.getElementById('beachDayBtn1');
            const btn2 = document.getElementById('beachDayBtn2');
            const body = document.getElementById('appBody');
            const banner = document.getElementById('activeDayBanner');
            const bannerText = document.getElementById('activeDayBannerText');
            const bannerBadge = document.getElementById('activeDayBannerBadge');

            if (day === 1) {
                btn1.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-slate-950 bg-pixelBlue shadow-lg border border-pixelBlue/60 transition-all touch-elastic flex items-center justify-center gap-2";
                btn2.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-pixelMuted hover:text-white transition-all touch-elastic flex items-center justify-center gap-2";
                body.classList.remove('day2-active');

                banner.className = "w-full py-2 px-4 rounded-xl bg-pixelBlue/20 border-2 border-pixelBlue/60 flex items-center justify-between";
                bannerText.className = "text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-pixelBlue flex items-center gap-2";
                bannerText.innerHTML = `<i class="fa-solid fa-eye text-base"></i> Currently Viewing: DAY 1 ALLOCATIONS`;
                bannerBadge.className = "text-[10px] font-black uppercase tracking-wider bg-pixelBlue text-slate-950 px-2.5 py-0.5 rounded font-heading shadow";
                bannerBadge.innerText = "Day 1 Active";
            } else {
                btn1.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-pixelMuted hover:text-white transition-all touch-elastic flex items-center justify-center gap-2";
                btn2.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-slate-950 bg-pixelGold shadow-lg border border-pixelGold/60 transition-all touch-elastic flex items-center justify-center gap-2";
                body.classList.add('day2-active');

                banner.className = "w-full py-2 px-4 rounded-xl bg-pixelGold/20 border-2 border-pixelGold/60 flex items-center justify-between";
                bannerText.className = "text-xs sm:text-sm font-black font-heading uppercase tracking-wider text-pixelGold flex items-center gap-2";
                bannerText.innerHTML = `<i class="fa-solid fa-eye text-base"></i> Currently Viewing: DAY 2 ALLOCATIONS`;
                bannerBadge.className = "text-[10px] font-black uppercase tracking-wider bg-pixelGold text-slate-950 px-2.5 py-0.5 rounded font-heading shadow";
                bannerBadge.innerText = "Day 2 Active";
            }

            renderFullBeachMatrix();
        }

        function renderFullBeachMatrix() {
            const container = document.getElementById('fullBeachZoneGrid');
            if (!viewerData || !viewerData.draw) return;

            const drawList = activeBeachDay === 1 ? (viewerData.draw.day1 || []) : (viewerData.draw.day2 || []);
            const selectedAngler = selectedAnglerId ? viewerData.anglers.find(a => a.id === selectedAnglerId) : null;
            const dayLabel = activeBeachDay === 1 ? "Day 1" : "Day 2";

            container.innerHTML = ZONE_COLORS.map(color => {
                const zonePegs = drawList.filter(d => (d.zone || d.z) === color);

                zonePegs.sort((a,b) => {
                    let numA = parseInt(a.peg || a.p) || 0;
                    let numB = parseInt(b.peg || b.p) || 0;
                    return numA - numB;
                });

                const pegRowsHTML = zonePegs.map(d => {
                    const angler = viewerData.anglers.find(a => a.id === (d.anglerId || d.aId));
                    const team = angler && viewerData.teams ? viewerData.teams.find(t => t.id === angler.teamId) : null;

                    const pegNumber = parseInt(d.peg || d.p) || 0;
                    const isMobility = angler && (angler.mobility || angler.mob);

                    // Check if row is selected angler or teammate
                    const isSelf = selectedAngler && angler && angler.id === selectedAngler.id;
                    const isTeammate = selectedAngler && angler && selectedAngler.teamId && angler.teamId === selectedAngler.teamId && !isSelf;

                    let highlightClasses = "bg-slate-900/70 border-white/10";
                    if (isSelf) {
                        highlightClasses = "bg-pixelBlue/30 border-pixelBlue border-2 shadow-lg ring-2 ring-pixelBlue/50";
                    } else if (isTeammate) {
                        highlightClasses = "bg-pixelCyan/20 border-pixelCyan/80 border-2";
                    }

                    return `
                        <div class="flex items-center justify-between py-1.5 px-2.5 rounded-xl border text-xs font-bold transition-all ${highlightClasses}">
                            <span class="bg-slate-900/90 text-pixelText border border-white/20 font-mono-tabular font-black px-2 py-0.5 rounded-md shrink-0 text-[11px]">
                                ${pegNumber} ${isMobility ? '<span class="text-pixelGold font-black ml-0.5">[A]</span>' : ''}
                            </span>
                            <div class="text-right min-w-0 flex-grow ml-2.5">
                                <span class="block font-black uppercase tracking-wider text-pixelText font-heading truncate text-xs flex items-center justify-end gap-1">
                                    ${isSelf ? '<i class="fa-solid fa-user text-pixelBlue text-[10px]"></i>' : ''}
                                    ${isTeammate ? '<i class="fa-solid fa-users text-pixelCyan text-[10px]"></i>' : ''}
                                    ${(angler && angler.name ? angler.name : 'Unnamed').toUpperCase()}
                                </span>
                                <span class="block text-[9px] font-bold text-pixelMuted uppercase tracking-wider truncate">${team ? team.name.toUpperCase() : 'INDIVIDUAL'}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="glass-card-sm p-3.5 space-y-2.5 zone-card-${color}">
                        <div class="flex items-center justify-between pb-2 border-b border-white/20 sticky top-[10px] bg-slate-900/95 backdrop-blur-md pt-1 z-10 rounded-t-lg">
                            <span class="font-heading uppercase tracking-wider font-black text-sm sm:text-base text-white drop-shadow">${color} Zone (${dayLabel})</span>
                            <span class="text-[11px] font-mono-tabular font-black glass-pill px-2.5 py-0.5 border border-white/30 text-white">${zonePegs.length} Pegs</span>
                        </div>
                        <div class="space-y-1.5">${pegRowsHTML || '<span class="text-pixelMuted italic text-xs">No allocations</span>'}</div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
