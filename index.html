<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorescore Competitor Draw Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Barlow Condensed & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pixelBlue: '#a8c7fa',
                        pixelGold: '#fde047',
                        pixelEmerald: '#4ade80',
                        pixelCyan: '#38bdf8',
                        pixelCoral: '#f87171',
                        pixelMuted: '#cbd5e1',
                        pixelText: '#ffffff'
                    },
                    fontFamily: {
                        heading: ['Barlow Condensed', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root { color-scheme: dark; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #1e293b 65%, #0f172a 100%) fixed;
            color: #ffffff;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .font-mono-tabular {
            font-family: 'Inter', system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-radius: 28px;
        }

        .glass-card-sm {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3);
            border-radius: 20px;
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
        }

        .zone-badge-Red { background: rgba(239, 68, 68, 0.65); border: 2px solid #f87171; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .zone-badge-Yellow { background: rgba(234, 179, 8, 0.65); border: 2px solid #fde047; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .zone-badge-Green { background: rgba(34, 197, 94, 0.65); border: 2px solid #4ade80; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .zone-badge-Blue { background: rgba(14, 165, 233, 0.65); border: 2px solid #38bdf8; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .zone-card-Red { background: rgba(239, 68, 68, 0.28); border-top: 6px solid #f87171; border-color: rgba(248, 113, 113, 0.6); }
        .zone-card-Yellow { background: rgba(234, 179, 8, 0.28); border-top: 6px solid #fde047; border-color: rgba(253, 224, 71, 0.6); }
        .zone-card-Green { background: rgba(34, 197, 94, 0.28); border-top: 6px solid #4ade80; border-color: rgba(74, 222, 128, 0.6); }
        .zone-card-Blue { background: rgba(14, 165, 233, 0.28); border-top: 6px solid #38bdf8; border-color: rgba(56, 189, 248, 0.6); }

        .touch-elastic {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .touch-elastic:active { transform: scale(0.96); }

        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(168, 199, 250, 0.5); border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-pixelBlue selection:text-slate-950 pb-12">

    <!-- HEADER BAR -->
    <header class="bg-slate-950/80 backdrop-blur-2xl border-b border-white/20 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-pixelBlue/25 border border-pixelBlue/50 flex items-center justify-center text-pixelBlue">
                    <i class="fa-solid fa-water text-xl"></i>
                </div>
                <div>
                    <h1 id="headerCompTitle" class="text-xl sm:text-2xl font-black font-heading text-pixelText leading-none uppercase tracking-wider">Shorescore Draw Viewer</h1>
                    <span id="headerDurationBadge" class="text-[11px] font-black text-pixelEmerald uppercase tracking-wider font-heading">Live Competitor Allocations</span>
                </div>
            </div>

            <span id="headerTotalAnglersBadge" class="text-xs font-black glass-pill px-3.5 py-1.5 text-pixelBlue border border-pixelBlue/40 font-mono-tabular uppercase">
                0 Anglers
            </span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-6 py-6 w-full space-y-6 flex-grow">

        <!-- NO DATA / MISSING JSON WARNING -->
        <div id="noDataPanel" class="glass-card p-8 sm:p-12 text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-pixelCoral/25 border border-pixelCoral/50 flex items-center justify-center text-pixelCoral mx-auto">
                <i class="fa-solid fa-file-circle-exclamation text-3xl"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-black font-heading text-pixelText uppercase tracking-wider">No Draw Data Found</h2>
            <p class="text-pixelMuted text-sm sm:text-base max-w-md mx-auto font-medium">
                Please upload the <code class="text-pixelBlue bg-slate-900 px-2 py-1 rounded font-mono-tabular">live_draw.json</code> file exported from Shorescore to this repository.
            </p>
        </div>

        <!-- MAIN VIEWER CONTENT CONTAINER -->
        <div id="viewerMainContent" class="hidden space-y-6">

            <!-- SECTION 1: PERSONAL ANGLER LOOKUP (TOP DASHBOARD) -->
            <div class="glass-card p-6 sm:p-8 space-y-6">
                <div class="space-y-2">
                    <label class="block text-xs font-black uppercase tracking-wider text-pixelBlue font-heading">
                        <i class="fa-solid fa-magnifying-glass mr-1.5"></i> Find My Draw & Teammates
                    </label>
                    <div class="relative">
                        <input type="text" id="anglerSearchInput" onkeyup="handleAnglerSearch()" class="w-full bg-slate-900/90 border border-white/25 rounded-2xl px-5 py-4 text-pixelText font-bold text-base uppercase tracking-wider placeholder-pixelMuted focus:outline-none focus:border-pixelBlue" placeholder="Type your name (e.g. McCreadie)...">
                        <button onclick="clearSearchInput()" class="absolute right-4 top-3.5 w-9 h-9 rounded-full glass-pill flex items-center justify-center text-pixelMuted hover:text-white font-bold text-lg">&times;</button>
                    </div>
                </div>

                <!-- PERSONAL RESULT CARD CONTAINER -->
                <div id="personalResultCardContainer"></div>
            </div>

            <!-- SECTION 2: FULL VENUE BEACH MATRIX -->
            <div class="glass-card p-6 sm:p-8 space-y-6">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/20 pb-5">
                    <div>
                        <h3 class="text-xl sm:text-2xl font-black font-heading text-pixelText flex items-center gap-2.5 uppercase tracking-wider">
                            <i class="fa-solid fa-layer-group text-pixelBlue"></i> Full Beach Venue Layout
                        </h3>
                        <p class="text-xs sm:text-sm text-pixelMuted font-medium mt-0.5">Browse complete zone allocations across all pegs on the venue.</p>
                    </div>

                    <!-- DAY SELECTOR TOGGLE (IF 2-DAY) -->
                    <div id="beachDayToggleGroup" class="flex items-center gap-2 self-stretch sm:self-auto hidden">
                        <button onclick="setBeachViewDay(1)" id="beachDayBtn1" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-black font-heading uppercase tracking-wider text-slate-950 bg-pixelBlue shadow-md border border-pixelBlue/60 transition-all touch-elastic">
                            Day 1
                        </button>
                        <button onclick="setBeachViewDay(2)" id="beachDayBtn2" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-black font-heading uppercase tracking-wider text-pixelMuted glass-pill hover:text-white transition-all touch-elastic">
                            Day 2
                        </button>
                    </div>
                </div>

                <!-- 4-ZONE CARD GRID -->
                <div id="fullBeachZoneGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5"></div>
            </div>

        </div>

    </main>

    <!-- VIEWER ENGINE SCRIPT -->
    <script>
        let viewerData = null;
        let activeBeachDay = 1;

        const ZONE_COLORS = ['Red', 'Yellow', 'Green', 'Blue'];

        window.addEventListener('DOMContentLoaded', () => {
            loadLiveDrawJSON();
        });

        function loadLiveDrawJSON() {
            const timestamp = new Date().getTime();
            
            fetch('live_draw.json?v=' + timestamp)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Successfully loaded live_draw.json:", data);
                    
                    if (data && data.anglers && data.draw) {
                        viewerData = data;
                        renderHeaderDetails();
                        document.getElementById('noDataPanel').classList.add('hidden');
                        document.getElementById('viewerMainContent').classList.remove('hidden');
                        renderPersonalCard(null);
                        renderFullBeachMatrix();
                    } else {
                        console.error("Data missing required keys (anglers or draw):", data);
                        showNoDataWarning();
                    }
                })
                .catch(err => {
                    console.error("Failed to fetch live_draw.json:", err);
                    showNoDataWarning();
                });
        }

        function showNoDataWarning() {
            document.getElementById('noDataPanel').classList.remove('hidden');
            document.getElementById('viewerMainContent').classList.add('hidden');
        }

        function renderHeaderDetails() {
            document.getElementById('headerCompTitle').innerText = viewerData.title || viewerData.t || "Shore Competition";
            
            const matchDuration = viewerData.duration || viewerData.d || 1;
            document.getElementById('headerDurationBadge').innerText = matchDuration === 2 ? '2-Day Competition' : '1-Day Competition';
            document.getElementById('headerTotalAnglersBadge').innerText = `${viewerData.anglers.length} Anglers`;

            const dayToggleGroup = document.getElementById('beachDayToggleGroup');
            if (matchDuration === 2) dayToggleGroup.classList.remove('hidden');
            else dayToggleGroup.classList.add('hidden');
        }

        function handleAnglerSearch() {
            const query = (document.getElementById('anglerSearchInput').value || '').trim().toLowerCase();
            if (query.length < 2) {
                renderPersonalCard(null);
                return;
            }

            const matchedAngler = viewerData.anglers.find(a => (a.name || '').toLowerCase().includes(query));
            renderPersonalCard(matchedAngler || null);
        }

        function clearSearchInput() {
            document.getElementById('anglerSearchInput').value = '';
            renderPersonalCard(null);
        }

        function renderPersonalCard(targetAngler) {
            const container = document.getElementById('personalResultCardContainer');

            if (!targetAngler) {
                container.innerHTML = `
                    <div class="glass-card-sm p-6 text-center text-pixelMuted font-bold text-sm">
                        Type your name in the search box above to isolate your Day 1 & Day 2 pegs and teammates.
                    </div>
                `;
                return;
            }

            const matchDuration = viewerData.duration || viewerData.d || 1;
            const d1Alloc = viewerData.draw.day1.find(d => (d.anglerId || d.aId) === targetAngler.id);
            const d2Alloc = matchDuration === 2 ? viewerData.draw.day2.find(d => (d.anglerId || d.aId) === targetAngler.id) : null;
            const team = viewerData.teams.find(t => t.id === targetAngler.teamId);

            const teammates = targetAngler.teamId 
                ? viewerData.anglers.filter(a => a.teamId === targetAngler.teamId && a.id !== targetAngler.id)
                : [];

            let teammateRowsHTML = '';
            if (teammates.length > 0) {
                teammateRowsHTML = teammates.map(m => {
                    const mD1 = viewerData.draw.day1.find(d => (d.anglerId || d.aId) === m.id);
                    const mD2 = matchDuration === 2 ? viewerData.draw.day2.find(d => (d.anglerId || d.aId) === m.id) : null;

                    const mD1Zone = mD1 ? (mD1.zone || mD1.z) : '';
                    const mD1Peg = mD1 ? (mD1.peg || mD1.p) : '';
                    const mD2Zone = mD2 ? (mD2.zone || mD2.z) : '';
                    const mD2Peg = mD2 ? (mD2.peg || mD2.p) : '';

                    return `
                        <div class="flex items-center justify-between py-2.5 px-3.5 rounded-xl bg-slate-900/80 border border-white/15 text-xs font-bold">
                            <span class="text-pixelText font-heading text-sm uppercase truncate">${(m.name || 'Unnamed').toUpperCase()}</span>
                            <div class="flex items-center gap-2 font-mono-tabular shrink-0">
                                ${mD1 ? `<span class="zone-badge-${mD1Zone} px-2.5 py-0.5 rounded-md font-black">D1: ${mD1Zone} Peg${mD1Peg}</span>` : ''}
                                ${mD2 ? `<span class="zone-badge-${mD2Zone} px-2.5 py-0.5 rounded-md font-black">D2: ${mD2Zone} Peg${mD2Peg}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const d1Zone = d1Alloc ? (d1Alloc.zone || d1Alloc.z) : '';
            const d1Peg = d1Alloc ? (d1Alloc.peg || d1Alloc.p) : '';
            const d2Zone = d2Alloc ? (d2Alloc.zone || d2Alloc.z) : '';
            const d2Peg = d2Alloc ? (d2Alloc.peg || d2Alloc.p) : '';
            const isMobility = targetAngler.mobility || targetAngler.mob;

            container.innerHTML = `
                <div class="glass-card-sm p-6 space-y-6 border-2 border-pixelBlue/60 bg-pixelBlue/10">
                    <div class="flex items-center justify-between border-b border-white/20 pb-4">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-2xl sm:text-3xl font-black font-heading text-pixelText uppercase tracking-wider">${(targetAngler.name || 'Unnamed').toUpperCase()}</h3>
                                ${isMobility ? '<span class="bg-pixelGold text-slate-950 font-black text-xs px-2 py-0.5 rounded-md font-sans">[A] MOBILITY</span>' : ''}
                            </div>
                            <span class="text-xs font-black text-pixelCyan uppercase tracking-wider font-heading">${team ? team.name.toUpperCase() : 'INDIVIDUAL COMPETITOR'}</span>
                        </div>
                        <span class="text-xs font-black glass-pill px-3 py-1 border border-pixelBlue/40 text-pixelBlue font-heading uppercase">Personal Match Card</span>
                    </div>

                    <!-- DAY 1 & DAY 2 ALLOCATION TILES -->
                    <div class="grid grid-cols-1 ${matchDuration === 2 ? 'sm:grid-cols-2' : ''} gap-4">
                        <div class="glass-card-sm p-4 space-y-2 border border-white/20 text-center">
                            <span class="text-xs font-black text-pixelMuted uppercase tracking-wider font-heading block">Day 1 Placement</span>
                            ${d1Alloc ? `
                                <div class="zone-badge-${d1Zone} rounded-2xl py-3 px-4 shadow-lg">
                                    <span class="block text-xs font-black uppercase tracking-wider font-heading">${d1Zone} Zone</span>
                                    <span class="text-3xl sm:text-4xl font-black font-mono-tabular">Peg ${d1Peg}</span>
                                </div>
                            ` : '<span class="text-pixelMuted italic text-xs">Unassigned</span>'}
                        </div>

                        ${matchDuration === 2 ? `
                            <div class="glass-card-sm p-4 space-y-2 border border-white/20 text-center">
                                <span class="text-xs font-black text-pixelMuted uppercase tracking-wider font-heading block">Day 2 Placement</span>
                                ${d2Alloc ? `
                                    <div class="zone-badge-${d2Zone} rounded-2xl py-3 px-4 shadow-lg">
                                        <span class="block text-xs font-black uppercase tracking-wider font-heading">${d2Zone} Zone</span>
                                        <span class="text-3xl sm:text-4xl font-black font-mono-tabular">Peg ${d2Peg}</span>
                                    </div>
                                ` : '<span class="text-pixelMuted italic text-xs">Unassigned</span>'}
                            </div>
                        ` : ''}
                    </div>

                    <!-- TEAMMATES PANEL -->
                    ${teammates.length > 0 ? `
                        <div class="pt-2 border-t border-white/20 space-y-3">
                            <span class="text-xs font-black text-pixelMuted uppercase tracking-wider font-heading block flex items-center gap-2">
                                <i class="fa-solid fa-users text-pixelBlue"></i> Team Members (${team ? team.name.toUpperCase() : ''}):
                            </span>
                            <div class="space-y-2">${teammateRowsHTML}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function setBeachViewDay(day) {
            activeBeachDay = day;
            const btn1 = document.getElementById('beachDayBtn1');
            const btn2 = document.getElementById('beachDayBtn2');

            if (day === 1) {
                btn1.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-black font-heading uppercase tracking-wider text-slate-950 bg-pixelBlue shadow-md border border-pixelBlue/60 transition-all touch-elastic";
                btn2.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-black font-heading uppercase tracking-wider text-pixelMuted glass-pill hover:text-white transition-all touch-elastic";
            } else {
                btn1.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-black font-heading uppercase tracking-wider text-pixelMuted glass-pill hover:text-white transition-all touch-elastic";
                btn2.className = "flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-black font-heading uppercase tracking-wider text-slate-950 bg-pixelGold shadow-md border border-pixelGold/60 transition-all touch-elastic";
            }

            renderFullBeachMatrix();
        }

        function renderFullBeachMatrix() {
            const container = document.getElementById('fullBeachZoneGrid');
            if (!viewerData || !viewerData.draw) return;

            const drawList = activeBeachDay === 1 ? viewerData.draw.day1 : viewerData.draw.day2;

            container.innerHTML = ZONE_COLORS.map(color => {
                const zonePegs = drawList.filter(d => (d.zone || d.z) === color);

                zonePegs.sort((a,b) => {
                    let numA = parseInt(a.peg || a.p) || 0;
                    let numB = parseInt(b.peg || b.p) || 0;
                    return numA - numB;
                });

                const pegRowsHTML = zonePegs.map(d => {
                    const angler = viewerData.anglers.find(a => a.id === (d.anglerId || d.aId));
                    const team = angler ? viewerData.teams.find(t => t.id === angler.teamId) : null;

                    const pegNumber = d.peg || d.p;
                    const isMobility = angler && (angler.mobility || angler.mob);

                    return `
                        <div class="flex items-center justify-between py-2 px-3 rounded-xl bg-slate-900/70 border border-white/10 text-xs font-bold">
                            <span class="bg-slate-900/90 text-pixelText border border-white/20 font-mono-tabular font-black px-2.5 py-1 rounded-md shrink-0">
                                ${pegNumber} ${isMobility ? '<span class="text-pixelGold font-black ml-0.5">[A]</span>' : ''}
                            </span>
                            <div class="text-right min-w-0 flex-grow ml-3">
                                <span class="block font-black uppercase tracking-wider text-pixelText font-heading truncate text-xs sm:text-sm">${(angler && angler.name ? angler.name : 'Unnamed').toUpperCase()}</span>
                                <span class="block text-[10px] font-bold text-pixelMuted uppercase tracking-wider truncate">${team ? team.name.toUpperCase() : 'INDIVIDUAL'}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="glass-card-sm p-4 space-y-3 zone-card-${color}">
                        <div class="flex items-center justify-between pb-2 border-b border-white/20">
                            <span class="font-heading uppercase tracking-wider font-black text-base text-white drop-shadow">${color} Zone</span>
                            <span class="text-xs font-mono-tabular font-black glass-pill px-3 py-0.5 border border-white/30 text-white">${zonePegs.length} Pegs</span>
                        </div>
                        <div class="space-y-2 max-h-96 overflow-y-auto custom-scrollbar pr-1">${pegRowsHTML || '<span class="text-pixelMuted italic text-xs">No allocations</span>'}</div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
